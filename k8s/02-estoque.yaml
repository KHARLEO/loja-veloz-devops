apiVersion: apps/v1
kind: Deployment
metadata: {name: estoque, namespace: loja-veloz}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: estoque}}
  template:
    metadata: {labels: {app: estoque}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: estoque
          image: ghcr.io/SEU_USUARIO/loja-veloz-estoque:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          env:
            - {name: SERVICE, value: estoque}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: veloz-db, key: database-url}}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: estoque, namespace: loja-veloz}
spec:
  selector: {app: estoque}
  ports: [{port: 8080, targetPort: 8080}]
  type: ClusterIP
