name: CI e imagens
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q services tests
      - run: python -m unittest discover -s tests -v
      - run: cp .env.ci .env && docker compose --env-file .env.ci config --quiet
  imagens:
    needs: testes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          REPO=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          for svc in gateway pedidos pagamentos estoque; do
            docker build --build-arg SERVICE="$svc" -t "ghcr.io/$REPO-$svc:$SHA" .
            docker push "ghcr.io/$REPO-$svc:$SHA"
          done
# Deploy automático em produção propositalmente não habilitado:
# adicionar approval de ambiente e credenciais federadas (OIDC) antes.
